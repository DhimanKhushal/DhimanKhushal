<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Selected product map</title>
  <desc id="desc">A visual map of Khushal Singh's work across education systems, client platforms, public web builds, and service flows.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#1F1647"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="58" y="67" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="30" font-weight="700">Selected product surfaces</text>
  <text x="58" y="96" fill="#94A3B8" font-family="Arial, sans-serif" font-size="16">Systems, client platforms, and public web builds.</text>
  <g font-family="Arial, sans-serif">
    <rect x="58" y="125" width="335" height="137" rx="18" fill="#171337" stroke="#7C3AED" stroke-opacity=".6"/>
    <text x="84" y="160" fill="#A78BFA" font-size="14" font-weight="700" letter-spacing="2">EDUCATION SYSTEMS</text><text x="84" y="197" fill="#F8FAFC" font-size="24" font-weight="700">WebLiquids Campus OS</text><text x="84" y="228" fill="#CBD5E1" font-size="16">LMS · ERP · RBAC · AI flows</text><text x="84" y="251" fill="#94A3B8" font-size="14">Next.js · Prisma · PostgreSQL</text>
    <rect x="433" y="125" width="335" height="137" rx="18" fill="#102541" stroke="#38BDF8" stroke-opacity=".55"/>
    <text x="459" y="160" fill="#7DD3FC" font-size="14" font-weight="700" letter-spacing="2">CLIENT PLATFORMS</text><text x="459" y="197" fill="#F8FAFC" font-size="24" font-weight="700">CodeClousor / Azule</text><text x="459" y="228" fill="#CBD5E1" font-size="16">Agency and architectural sites</text><text x="459" y="251" fill="#94A3B8" font-size="14">Next.js · Motion · Tailwind</text>
    <rect x="808" y="125" width="334" height="137" rx="18" fill="#171337" stroke="#7C3AED" stroke-opacity=".6"/>
    <text x="834" y="160" fill="#A78BFA" font-size="14" font-weight="700" letter-spacing="2">PUBLIC BUILDS</text><text x="834" y="197" fill="#F8FAFC" font-size="24" font-weight="700">Web products</text><text x="834" y="228" fill="#CBD5E1" font-size="16">Webcodder · Property · Doner</text><text x="834" y="251" fill="#94A3B8" font-size="14">Next.js · TypeScript · React</text>
    <rect x="58" y="291" width="1084" height="82" rx="18" fill="#24164A" stroke="#A78BFA" stroke-opacity=".55"/>
    <circle cx="89" cy="332" r="7" fill="#C4B5FD" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    <text x="111" y="324" fill="#C4B5FD" font-size="14" font-weight="700" letter-spacing="2">SERVICE FLOWS</text><text x="111" y="352" fill="#F8FAFC" font-size="20" font-weight="700">PsychoWaves · MeMantra · ScoreLoom</text>
    <text x="635" y="342" fill="#CBD5E1" font-size="16">SvelteKit · Prisma · JWT · Razorpay</text>
  </g>
</svg>
