<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Selected product map</title>
  <desc id="desc">A graphite visual map of Khushal Singh's work across education systems, client platforms, public web builds, and service flows.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100D"/><stop offset="1" stop-color="#1B1812"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#C7A86B" stroke-opacity=".07"/></pattern><linearGradient id="scan" x1="0" x2="1"><stop stop-color="#C7A86B" stop-opacity="0"/><stop offset=".5" stop-color="#E0C28D" stop-opacity=".1"/><stop offset="1" stop-color="#C7A86B" stop-opacity="0"/></linearGradient></defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/><rect width="1200" height="420" rx="18" fill="url(#grid)"/><rect x="-320" y="0" width="320" height="420" fill="url(#scan)"><animate attributeName="x" values="-320;1200" dur="5.6s" repeatCount="indefinite"/></rect>
  <path d="M58 281H1142" stroke="#C7A86B" stroke-opacity=".4" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="4s" repeatCount="indefinite"/></path>
  <text x="58" y="67" fill="#F4EBD8" font-family="Arial, sans-serif" font-size="30" font-weight="700">Selected product surfaces</text>
  <text x="58" y="96" fill="#A69B87" font-family="Arial, sans-serif" font-size="16">Systems, client platforms, and public web builds.</text>
  <g font-family="Arial, sans-serif">
    <rect x="58" y="125" width="335" height="137" rx="10" fill="#11100D" stroke="#3A3327"/><rect x="58" y="125" width="4" height="137" rx="2" fill="#C7A86B"/>
    <text x="84" y="160" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">EDUCATION SYSTEMS</text><text x="84" y="197" fill="#F4EBD8" font-size="24" font-weight="700">WebLiquids Campus OS</text><text x="84" y="228" fill="#E6D9C1" font-size="16">LMS · ERP · RBAC · AI flows</text><text x="84" y="251" fill="#A69B87" font-size="14">Next.js · Prisma · PostgreSQL</text>
    <rect x="433" y="125" width="335" height="137" rx="10" fill="#11100D" stroke="#3A3327"/><rect x="433" y="125" width="4" height="137" rx="2" fill="#C7A86B"/>
    <text x="459" y="160" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">CLIENT PLATFORMS</text><text x="459" y="197" fill="#F4EBD8" font-size="24" font-weight="700">CodeClousor / Azule</text><text x="459" y="228" fill="#E6D9C1" font-size="16">Agency and architectural sites</text><text x="459" y="251" fill="#A69B87" font-size="14">Next.js · Motion · Tailwind</text>
    <rect x="808" y="125" width="334" height="137" rx="10" fill="#11100D" stroke="#3A3327"/><rect x="808" y="125" width="4" height="137" rx="2" fill="#C7A86B"/>
    <text x="834" y="160" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">PUBLIC BUILDS</text><text x="834" y="197" fill="#F4EBD8" font-size="24" font-weight="700">Web products</text><text x="834" y="228" fill="#E6D9C1" font-size="16">Webcodder · Property · Doner</text><text x="834" y="251" fill="#A69B87" font-size="14">Next.js · TypeScript · React</text>
    <rect x="58" y="300" width="1084" height="73" rx="10" fill="#11100D" stroke="#3A3327"/>
    <circle cx="89" cy="336" r="5" fill="#C7A86B"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    <text x="111" y="327" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">SERVICE FLOWS</text><text x="111" y="354" fill="#F4EBD8" font-size="20" font-weight="700">PsychoWaves · MeMantra · ScoreLoom</text><text x="635" y="345" fill="#E6D9C1" font-size="16">SvelteKit · Prisma · JWT · Razorpay</text>
  </g>
</svg>
