<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Current focus</title>
  <desc id="desc">Four current focus areas: product architecture, LMS and ERP workflows, applied AI integrations, and developer training.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#12172A"/><stop offset="1" stop-color="#2E1065"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="220" rx="28" fill="url(#bg)"/>
  <text x="58" y="61" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CURRENT FOCUS / LIVE</text>
  <path d="M58 109 H1142" stroke="#A78BFA" stroke-opacity=".28"/>
  <circle cx="212" cy="109" r="7" fill="#38BDF8" filter="url(#g)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="481" cy="109" r="7" fill="#C4B5FD" filter="url(#g)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
  <circle cx="751" cy="109" r="7" fill="#A78BFA" filter="url(#g)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="1020" cy="109" r="7" fill="#38BDF8" filter="url(#g)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
  <g font-family="Arial, sans-serif"><text x="58" y="151" fill="#F8FAFC" font-size="18" font-weight="700">01 / Product architecture</text><text x="328" y="151" fill="#F8FAFC" font-size="18" font-weight="700">02 / LMS &amp; ERP workflows</text><text x="598" y="151" fill="#F8FAFC" font-size="18" font-weight="700">03 / Applied AI integration</text><text x="868" y="151" fill="#F8FAFC" font-size="18" font-weight="700">04 / Developer training</text></g>
  <text x="58" y="184" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14">Designing systems that turn complex operations into clear, reliable product flows.</text>
</svg>
