<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Current focus</title>
  <desc id="desc">Four current focus areas: product architecture, LMS and ERP workflows, applied AI integrations, and developer training.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#11100D"/><stop offset="1" stop-color="#1B1812"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#C7A86B" stroke-opacity=".06"/></pattern><linearGradient id="scan" x1="0" x2="1"><stop stop-color="#C7A86B" stop-opacity="0"/><stop offset=".5" stop-color="#E0C28D" stop-opacity=".12"/><stop offset="1" stop-color="#C7A86B" stop-opacity="0"/></linearGradient></defs>
  <rect width="1200" height="220" rx="18" fill="url(#bg)"/><rect width="1200" height="220" rx="18" fill="url(#grid)"/><rect x="-320" y="0" width="320" height="220" fill="url(#scan)"><animate attributeName="x" values="-320;1200" dur="4.4s" repeatCount="indefinite"/></rect>
  <text x="58" y="61" fill="#C7A86B" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CURRENT FOCUS / LIVE</text>
  <path d="M58 109H1142" stroke="#3A3327"/><path d="M58 109H1142" stroke="#C7A86B" stroke-opacity=".6" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" from="0" to="-78" dur="4s" repeatCount="indefinite"/></path>
  <g fill="#C7A86B"><circle cx="212" cy="109" r="6"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle><circle cx="481" cy="109" r="6"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin=".5s" repeatCount="indefinite"/></circle><circle cx="751" cy="109" r="6"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin="1s" repeatCount="indefinite"/></circle><circle cx="1020" cy="109" r="6"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle></g>
  <g font-family="Arial, sans-serif"><text x="58" y="151" fill="#F4EBD8" font-size="18" font-weight="700">01 / Product architecture</text><text x="328" y="151" fill="#F4EBD8" font-size="18" font-weight="700">02 / LMS &amp; ERP workflows</text><text x="598" y="151" fill="#F4EBD8" font-size="18" font-weight="700">03 / Applied AI integration</text><text x="868" y="151" fill="#F4EBD8" font-size="18" font-weight="700">04 / Developer training</text></g>
  <text x="58" y="184" fill="#A69B87" font-family="Arial, sans-serif" font-size="14">Signal motion restarts each time the card loads.</text>
</svg>
