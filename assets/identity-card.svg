<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Khushal Singh profile card</title>
  <desc id="desc">A graphite profile card for a full-stack engineer, developer trainer, and applied AI automation builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100D"/><stop offset="1" stop-color="#1B1812"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#C7A86B" stroke-opacity=".08"/></pattern>
    <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#C7A86B" stop-opacity="0"/><stop offset=".5" stop-color="#E0C28D" stop-opacity=".13"/><stop offset="1" stop-color="#C7A86B" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/><rect width="1200" height="430" rx="18" fill="url(#grid)"/><rect x="-320" y="0" width="320" height="430" fill="url(#scan)"><animate attributeName="x" values="-320;1200" dur="4.8s" repeatCount="indefinite"/></rect>
  <path d="M-100 350 C96 238 202 423 404 319 S665 218 853 306 S1062 376 1300 183" fill="none" stroke="#C7A86B" stroke-opacity=".48" stroke-width="1.5" stroke-dasharray="14 14"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="4s" repeatCount="indefinite"/></path>
  <path d="M-100 361 C96 249 202 434 404 330 S665 229 853 317 S1062 387 1300 194" fill="none" stroke="#A69B87" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="404" cy="319" r="5" fill="#C7A86B" filter="url(#soft)"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="853" cy="306" r="5" fill="#E0C28D" filter="url(#soft)"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
  <text x="74" y="76" fill="#C7A86B" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">ENGINEERING PROFILE / 01</text>
  <text x="74" y="151" fill="#F4EBD8" font-family="Arial, sans-serif" font-size="56" font-weight="700">Khushal Singh</text>
  <text x="78" y="193" fill="#A69B87" font-family="Arial, sans-serif" font-size="22">FULL-STACK ENGINEER  ·  DEVELOPER TRAINER</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="74" y="225" width="202" height="35" rx="6" fill="#1B1812" stroke="#3A3327"/><text x="94" y="248" fill="#E6D9C1">B.TECH · CSE</text>
    <rect x="290" y="225" width="173" height="35" rx="6" fill="#1B1812" stroke="#3A3327"/><text x="310" y="248" fill="#E6D9C1">PUNJAB, INDIA</text>
    <rect x="477" y="225" width="260" height="35" rx="6" fill="#1B1812" stroke="#3A3327"/><text x="498" y="248" fill="#E6D9C1">APPLIED AI AUTOMATION</text>
  </g>
  <g transform="translate(74 303)" font-family="Arial, sans-serif">
    <rect width="316" height="83" rx="10" fill="#11100D" fill-opacity=".88" stroke="#3A3327"/>
    <text x="20" y="30" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">SYSTEMS</text><text x="20" y="58" fill="#E6D9C1" font-size="18">LMS · ERP · RBAC</text>
    <rect x="338" width="316" height="83" rx="10" fill="#11100D" fill-opacity=".88" stroke="#3A3327"/>
    <text x="358" y="30" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">WORKFLOWS</text><text x="358" y="58" fill="#E6D9C1" font-size="18">AI APIs · n8n · Payments</text>
    <rect x="676" width="316" height="83" rx="10" fill="#11100D" fill-opacity=".88" stroke="#3A3327"/>
    <text x="696" y="30" fill="#C7A86B" font-size="13" font-weight="700" letter-spacing="2">MENTORSHIP</text><text x="696" y="58" fill="#E6D9C1" font-size="18">Teaching · Code Review</text>
  </g>
</svg>
