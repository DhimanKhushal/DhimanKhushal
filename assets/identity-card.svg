  <text x="74" y="151" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="56" font-weight="700">Khushal Singh</text>
  <text x="78" y="193" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22">FULL-STACK ENGINEER  ·  DEVELOPER TRAINER</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="74" y="225" width="202" height="35" rx="17" fill="#2E1A5E" stroke="#7C3AED" stroke-opacity=".65"/><text x="94" y="248" fill="#DDD6FE">B.TECH · CSE</text>
    <rect x="290" y="225" width="173" height="35" rx="17" fill="#132B52" stroke="#38BDF8" stroke-opacity=".55"/><text x="310" y="248" fill="#BAE6FD">PUNJAB, INDIA</text>
    <rect x="477" y="225" width="260" height="35" rx="17" fill="#2B194E" stroke="#A78BFA" stroke-opacity=".55"/><text x="498" y="248" fill="#E9D5FF">APPLIED AI AUTOMATION</text>
  </g>
  <g transform="translate(74 303)" font-family="Arial, sans-serif">
    <rect width="316" height="83" rx="14" fill="#0B1020" fill-opacity=".62" stroke="#A78BFA" stroke-opacity=".28"/>
    <text x="20" y="30" fill="#A78BFA" font-size="14" font-weight="700" letter-spacing="2">SYSTEMS</text><text x="20" y="58" fill="#E2E8F0" font-size="18">LMS · ERP · RBAC</text>
    <rect x="338" width="316" height="83" rx="14" fill="#0B1020" fill-opacity=".62" stroke="#A78BFA" stroke-opacity=".28"/>
    <text x="358" y="30" fill="#38BDF8" font-size="14" font-weight="700" letter-spacing="2">WORKFLOWS</text><text x="358" y="58" fill="#E2E8F0" font-size="18">AI APIs · n8n · Payments</text>
    <rect x="676" width="316" height="83" rx="14" fill="#0B1020" fill-opacity=".62" stroke="#A78BFA" stroke-opacity=".28"/>
    <text x="696" y="30" fill="#C4B5FD" font-size="14" font-weight="700" letter-spacing="2">MENTORSHIP</text><text x="696" y="58" fill="#E2E8F0" font-size="18">Teaching · Code Review</text>
