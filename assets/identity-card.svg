<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Khushal Singh profile card</title>
  <desc id="desc">A dark violet profile card for a full-stack engineer, developer trainer, and applied AI automation builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="0.55" stop-color="#16143A"/><stop offset="1" stop-color="#311364"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#6D28D9" stop-opacity="0"/><stop offset="0.45" stop-color="#A78BFA"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <path d="M0 339 C150 292 230 395 385 330 S650 221 795 290 S1010 351 1200 220" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M0 349 C150 302 230 405 385 340 S650 231 795 300 S1010 361 1200 230" fill="none" stroke="#7C3AED" stroke-opacity=".22" stroke-width="1"/>
  <circle cx="385" cy="330" r="7" fill="#C4B5FD" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="795" cy="290" r="7" fill="#38BDF8" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" begin=".6s" repeatCount="indefinite"/></circle>
  <g fill="#C4B5FD" opacity=".6"><circle cx="1027" cy="89" r="2"/><circle cx="1055" cy="89" r="2"/><circle cx="1083" cy="89" r="2"/></g>
